[project]
name = "mcq"
description = "Single-turn multiple choice: the smallest verifiers v1 environment"
tags = ["single-turn", "mcq", "train", "eval"]
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers==0.4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcq"]
